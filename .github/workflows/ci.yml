name: CI

on:
  push:
    branches: [main, 'maintenance/**']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to keep the queue short.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast feedback: lint, unit tests with coverage, build and bundle safety.
  verify:
    name: Lint, unit tests and bundle check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Reads the pinned version from .tool-versions (asdf format).
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build (development bundle)
        run: npm run dev

      - name: Bundle safety check
        run: npm run check:bundle

      - name: Verify no shipped dependency vulnerabilities
        run: npm run check:audit

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Slower, and the only job that proves the extension works in a real host.
  integration:
    name: Integration tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run dev

      - name: Run integration tests (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      - name: Run integration tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:integration

      - name: Upload integration coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage-${{ matrix.os }}
          path: coverage/integration/
          if-no-files-found: ignore
          retention-days: 7

  # Proves the exact artefact users would install can be produced.
  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Check packaged contents
        run: npx @vscode/vsce ls

      - name: Package
        run: npm run package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: command-variable-vsix
          path: dist/*.vsix
          retention-days: 14
